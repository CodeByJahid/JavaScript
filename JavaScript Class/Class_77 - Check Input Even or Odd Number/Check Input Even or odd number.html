<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Javascript Slider</title>
	
	<style type="text/css">
		.box{
			width: 100%;
			height: 100vh;
			display: flex;
			align-content: center;
			align-items: center;
			justify-content: center;
		}
		.box_item{
			padding: 50px;
			background: #ddd;
			border-radius: 5px;
		}
		input#text1 {
			padding: 10px;
			border-radius: 5px;
			outline: none;
			border: 1px solid #e9d5d5;
			background: #ffffff94;
			font-size: 16px;
		}

		button {
			padding: 10px 20px;
			border-radius: 5px;
			outline: none;
			border: 1px solid #e9d5d5;
			background: #138e13;
			font-size: 16px;
			color: #fff;
			cursor: pointer;
		}
	</style>
	
	
</head>
<body>
	
	 <div class="box">
		<div class="box_item">
			<input type="text" id="text1" placeholder="Enter no..."/>
			<button onclick="run();" type="button">Click</button>
		</div>
	</div>
	
	
	
	<script type="text/javascript">
		function run(){
			var input=document.getElementById("text1").value;
			if(input%2==0){
				alert("This is Even Number");
			}else{
				alert("This is odd Number")
			}
		};
	</script>
	
	
	
	
	
	
</body>
</html>
